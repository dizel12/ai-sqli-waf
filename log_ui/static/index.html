<!doctype html><meta charset="utf-8"><title>AI-WAF log</title>
<style>
body{font:14px system-ui;margin:1rem}
#sum{margin-bottom:1rem}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #ccc;padding:4px 8px;font-size:13px}
.b{background:#fdd}.a{background:#dfd}
.bar{display:inline-block;height:8px;background:#c33}
</style>
<div id="sum"></div>
<label><input type="checkbox" id="only"> blocked only</label>
<table id="t"><thead><tr><th>time</th><th>method</th><th>path</th><th>param</th>
<th>value</th><th>cnn</th><th>baseline</th><th>distilbert</th><th>active</th>
<th>decision</th><th>secure</th></tr></thead><tbody></tbody></table>
<script>
const tb=document.querySelector('#t tbody'),only=document.querySelector('#only');
const allEvents=[];
function textCell(text){
  const td=document.createElement('td');
  td.textContent=text;
  return td;
}
function barCell(x){
  const td=document.createElement('td');
  if(x==null){td.textContent='-';return td;}
  const span=document.createElement('span');
  span.className='bar';
  span.style.width=Math.round(x*60)+'px';
  td.appendChild(span);
  td.appendChild(document.createTextNode(x.toFixed(2)));
  return td;
}
function row(e){
  const tr=document.createElement('tr');
  tr.className=e.blocked?'b':'a';
  const s=e.scores||{};
  tr.appendChild(textCell(e.ts));
  tr.appendChild(textCell(e.method));
  tr.appendChild(textCell(e.path));
  tr.appendChild(textCell(e.param));
  tr.appendChild(textCell((e.value||'').slice(0,60)));
  tr.appendChild(barCell(s.cnn));
  tr.appendChild(barCell(s.baseline));
  tr.appendChild(barCell(s.distilbert));
  tr.appendChild(textCell(e.active_model));
  tr.appendChild(textCell(e.blocked?'BLOCKED':'ALLOWED'));
  tr.appendChild(textCell(e.secure_mode?'on':'off'));
  return tr;
}
function render(){
  tb.replaceChildren();
  for(const e of allEvents){
    if(only.checked && !e.blocked) continue;
    tb.prepend(row(e));
  }
}
async function boot(){
  const j=await (await fetch('/events?limit=100')).json();
  j.events.reverse().forEach(e=>allEvents.push(e));
  render();
  const s=await (await fetch('/summary')).json();
  document.querySelector('#sum').textContent=
    `total ${s.total} · blocked ${s.blocked} · rate ${(s.block_rate*100).toFixed(1)}% · active ${s.active_model||'?'} @ thr ${s.threshold ?? '?'}`;
  const es=new EventSource('/events/stream');
  es.onmessage=ev=>{allEvents.push(JSON.parse(ev.data));render();};
}
only.addEventListener('change',render);
boot();
</script>
